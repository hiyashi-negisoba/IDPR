# Fixture validating OffenseDef against offense_def.schema.json.
- id: offense.robbery
  identity:
    name: "강도죄 (예시)"
    statutory_refs: ["형법 제333조 (예시)"]
  elements:
    object:
      op: ref
      ref: ground_fact.property_taking
    conduct:
      op: all
      args:
        - {op: ref, ref: ground_fact.property_taking}
        - {op: ref, ref: legal_element.robbery_level_violence}
    mental:
      op: ref
      ref: legal_element.appropriation_intent

- id: offense.injury
  identity:
    name: "상해죄 (예시)"
    statutory_refs: ["형법 제257조 (예시)"]
  elements:
    conduct:
      op: ref
      ref: ground_fact.violence_used
    result:
      op: ref
      ref: ground_fact.injury_occurred
  exports:
    result: ground_fact.injury_occurred

- id: offense.embezzlement
  identity:
    name: "횡령죄 (예시)"
    statutory_refs: ["형법 제355조 제1항 (예시)"]
  elements:
    object:
      op: ref
      ref: ground_fact.entrustment_relation
    conduct:
      op: ref
      ref: ground_fact.appropriation_conduct
    mental:
      op: ref
      ref: legal_element.appropriation_intent
  qualifiers:
    - qualifier.occupational_status

# 2026-08-08 addition: section 20.1 (진정신분범, true status offense). Unlike
# occupational_embezzlement (a base status-neutral offense.embezzlement QUALIFY-ed
# with occupational_status), here the status requirement is a constitutive element
# of the base OffenseDef itself -- subject is not optional/added later, the offense
# does not exist without it. Exercises elements.subject carrying a status_requirement
# directly, not via QUALIFY.
- id: offense.bribery_taking
  identity:
    name: "수뢰죄 (예시)"
    statutory_refs: ["형법 제129조 제1항 (예시)"]
  elements:
    subject:
      op: ref
      ref: ground_fact.public_official_status
    conduct:
      op: ref
      ref: ground_fact.bribe_receipt

# 2026-08-08 addition: section 20.4 (composite offense + statutory nexus) fixture
# support -- second component offense composed with offense.robbery in
# derived_offense.robbery_rape (derived_offenses.yaml).
- id: offense.rape
  identity:
    name: "강간죄 (예시)"
    statutory_refs: ["형법 제297조 (예시)"]
  elements:
    conduct:
      op: ref
      ref: ground_fact.forcible_intercourse
