# Fixture validating ParticipationPolicyDef against participation_policy_def.schema.json.
# Covers section 20.6 (공동정범) and 20.7 (교사범).
# 2026-08-08 review: ParticipationPolicyDef is offense-agnostic shared General Part
# doctrine now, not keyed to a single offense id -- this fixture stands for "the
# default participation policy", and offense.robbery uses it unmodified (no
# participation_constraints needed in offenses.yaml for this example).
# 2026-08-08 (8th addendum, step 6C): instigator/aider now require their own `requires`
# expression, evaluated against the participant's own truths -- not the principal's.
- id: participation_policy.standard
  modes:
    principal:
      basis: direct
    co_principal:
      basis: attribution
      attributable_slots: [conduct]
    instigator:
      basis: derivative
      requires_conclusion: offense_realization
      requires: {op: ref, ref: ground_fact.instigation_conduct}
    aider:
      basis: derivative
      requires_conclusion: offense_realization
      requires: {op: ref, ref: ground_fact.aiding_conduct}
