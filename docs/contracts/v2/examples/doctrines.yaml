# Fixture validating DoctrineDef against doctrine_def.schema.json.
# Corresponds to section 11's self_defense worked example.
- id: doctrine.self_defense
  stage: unlawfulness
  requires:
    op: all
    args:
      - {op: ref, ref: ground_fact.current_attack}
      - {op: ref, ref: ground_fact.defensive_conduct}
      - {op: ref, ref: legal_element.proportionality}
  effect:
    effect: DEFEAT
    stage: unlawfulness

# 2026-08-08 addition: exercises the MODIFY effect's revised typed shape
# (modifier_ref, not a free-text 'modification' string -- see common.schema.json).
- id: doctrine.diminished_capacity
  stage: culpability
  requires:
    op: ref
    ref: legal_element.diminished_capacity
  effect:
    effect: MODIFY
    stage: culpability
    modifier_ref: modifier.culpability.diminished
    note: "형법 제10조 제2항 심신미약 (예시)"
