# Fixture validating DerivedOffenseDef against derived_offense_def.schema.json.
# Covers section 20.2 (부진정신분범, via QUALIFY) and 20.3 (결과적 가중범, via COMPOSE).

- id: derived_offense.occupational_embezzlement
  derivation:
    kind: qualify
    base: offense.embezzlement
    qualifier: qualifier.occupational_status
  flattened_elements:
    subject:
      op: ref
      ref: ground_fact.occupational_status
    object:
      op: ref
      ref: ground_fact.entrustment_relation
    conduct:
      op: ref
      ref: ground_fact.appropriation_conduct
    mental:
      op: ref
      ref: legal_element.appropriation_intent

- id: derived_offense.robbery_causing_injury
  derivation:
    kind: compose
    components:
      - {kind: offense, ref: offense.robbery, local_key: base_robbery}
      - {kind: primitive, ref: primitive.aggravated_result_attribution, local_key: result_attribution, slot: causation}
      - {kind: exported_component, ref: exported_component.injury_result, local_key: aggravated_result, slot: result}
    relations:
      # left_view/right_view (Step 5 addendum): causal_nexus is event x event, and both endpoints
      # are used here through their event aspect -- the robbery as the causing event, the exported
      # injury result as the caused one.
      - {relation: relation.causal_nexus, left: base_robbery, right: aggravated_result,
         left_view: event, right_view: event}
  flattened_elements:
    object:
      op: ref
      ref: ground_fact.property_taking
    conduct:
      op: all
      args:
        - {op: ref, ref: ground_fact.property_taking}
        - {op: ref, ref: legal_element.robbery_level_violence}
    mental:
      op: ref
      ref: legal_element.appropriation_intent
    result:
      op: ref
      ref: ground_fact.injury_occurred
    causation:
      op: ref
      ref: legal_element.aggravated_result_attribution

# 2026-08-08 addition: section 20.4 (composite offense + statutory nexus). Distinct
# from robbery_causing_injury above: that COMPOSE combines one offense with a
# primitive + an exported_component (aggravated-result composition, chained by a
# causal_nexus relation). This one composes two full, independently complete
# OffenseDef components (robbery, rape) joined not by causation but by occasion
# identity (relation.occasion_identity) -- the statutory nexus ("강도의 기회에")
# that makes 강도강간죄 a single composite offense rather than two separate crimes.
- id: derived_offense.robbery_rape
  derivation:
    kind: compose
    components:
      - {kind: offense, ref: offense.robbery, local_key: robbery_part}
      - {kind: offense, ref: offense.rape, local_key: rape_part}
    relations:
      # Same offense.robbery that robbery_causing_injury above binds as an *event* endpoint is
      # bound here as a *conduct* endpoint -- occasion identity (기회의 동일성) relates the two
      # courses of conduct, not two events. This pair is exactly why the view is authored per
      # relation binding instead of declared once on OffenseDef.
      - {relation: relation.occasion_identity, left: robbery_part, right: rape_part,
         left_view: conduct, right_view: conduct}
  flattened_elements:
    object:
      op: ref
      ref: ground_fact.property_taking
    conduct:
      op: all
      args:
        - {op: ref, ref: ground_fact.property_taking}
        - {op: ref, ref: legal_element.robbery_level_violence}
        - {op: ref, ref: ground_fact.forcible_intercourse}
    mental:
      op: ref
      ref: legal_element.appropriation_intent

# 2026-08-08 addition: 7th addendum (Completion) fixture support -- 강도살인죄, a 결합범
# whose attempt is expressly punishable (형법 제342조), unlike the 결과적 가중범 above
# (robbery_causing_injury), for which 미수 is not recognised. That difference is why this
# composition, not that one, carries a CompletionPolicy with a `suspends` state.
#
# It is also the fixture that shows why relation dispositions are authored rather than
# inferred: 강도살인미수 suspends result+causation, yet relation.occasion_identity must be
# RETAINED -- 살인의 실행행위가 강도의 기회에 이루어졌을 것은 미수에서도 그대로 요구된다.
# A rule that suspended relations touching a suspended slot would get this exactly wrong.
- id: derived_offense.robbery_homicide
  derivation:
    kind: compose
    components:
      - {kind: offense, ref: offense.robbery, local_key: robbery_part}
      - {kind: offense, ref: offense.homicide, local_key: homicide_part}
    relations:
      - {relation: relation.occasion_identity, left: robbery_part, right: homicide_part,
         left_view: conduct, right_view: conduct}
  flattened_elements:
    object:
      op: ref
      ref: ground_fact.property_taking
    conduct:
      op: all
      args:
        - {op: ref, ref: ground_fact.property_taking}
        - {op: ref, ref: legal_element.robbery_level_violence}
        - {op: ref, ref: ground_fact.killing_conduct}
    mental:
      op: ref
      ref: legal_element.appropriation_intent
    result:
      op: ref
      ref: ground_fact.death_of_victim
    causation:
      op: ref
      ref: legal_element.death_causation
