# rubric이 부르는 죄명 표기와 저작된 offense ref를 잇는 검수 파일.
#
# 이름이 저작 표기와 다르다는 것은 그 죄가 없다는 뜻이 아니다. 이 파일이 없으면 매칭 실패가
# 곧 "저작X"로 계산되고, 그 오분류가 규칙베이스 공백을 실제보다 크게 만든다. 판정은 여기서
# 사람이 하고, 스크립트는 판정되지 않은 이름을 `UNRESOLVED_NAME`으로 남긴다.
#
# aliases          : 다른 표기지만 같은 죄. 값은 registry의 offense ref이며 존재가 검증된다.
# known_unauthored : 사람이 확인해서 실제로 저작되지 않았다고 확정한 죄.
# ignore           : 죄명이 아니어서 집계에서 뺄 문자열.

aliases:
  # 형법 제129조 제1항. 저작 identity는 `수뢰죄`이고 rubric은 `뇌물수수죄`로 부른다.
  뇌물수수죄: offense.bribery_taking
  # 형법 제331조 제2항 후단. 합동범은 특수절도의 한 형태로 저작돼 있다.
  합동절도죄: derived_offense.special_theft
  # 준강도(제335조)가 강도치상 derivation의 binding으로 이미 저작돼 있다.
  준강도치상죄: derived_offense.robbery_causing_injury_by_aggravated_result

known_unauthored: []

ignore: []
