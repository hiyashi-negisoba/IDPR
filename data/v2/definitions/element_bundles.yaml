- id: bundle.negligence_bundle
  description: "형법 제14조 과실의 네 구성요건"
  requires:
    op: all
    args:
      - {op: ref, ref: legal_element.duty_of_care}
      - {op: ref, ref: legal_element.foreseeability}
      - {op: ref, ref: legal_element.avoidability}
      - {op: ref, ref: legal_element.breach_of_duty}

- id: bundle.omission_bundle
  description: "형법 제18조 부진정부작위범의 네 구성요건"
  requires:
    op: all
    args:
      - {op: ref, ref: legal_element.duty_to_act}
      - {op: ref, ref: ground_fact.possibility_to_act}
      - {op: ref, ref: ground_fact.failure_to_act}
      - {op: ref, ref: legal_element.equivalence_to_commission}

- id: bundle.quasi_robbery_purpose
  requires:
    op: any
    args:
      - {op: ref, ref: legal_element.purpose_to_resist_recapture}
      - {op: ref, ref: legal_element.purpose_to_avoid_arrest}
      - {op: ref, ref: legal_element.purpose_to_conceal_evidence}

- id: bundle.nonintentional_injury_result
  requires:
    op: not
    arg: {op: ref, ref: legal_element.injury_intent}

- id: bundle.nonintentional_homicide_result
  requires:
    op: not
    arg: {op: ref, ref: legal_element.homicide_intent}
