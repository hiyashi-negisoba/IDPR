# The policies below are the reviewed KCL-26 completion slice.  Statutory
# punishability comes from data/rulebase/stage.yaml and the state conditions from
# the corresponding predicate-dictionary worksheets.  They deliberately do not
# infer an attempt merely because the completed form failed.

- id: completion_policy.homicide
  offense: offense.homicide
  states:
    completed:
      when: {op: ref, ref: ground_fact.death_of_victim}
      punishable: true
    attempted:
      when:
        op: all
        args:
          - {op: ref, ref: legal_element.commencement_of_execution}
          - {op: not, arg: {op: ref, ref: ground_fact.death_of_victim}}
      punishable: true
      blocked_when: {op: ref, ref: ground_fact.means_or_object_defect}
      defeated_by_state: [abandoned_attempt]
      suspends: [result, causation]
      requires: {op: ref, ref: legal_element.commencement_of_execution}
    abandoned_attempt:
      when:
        op: all
        args:
          - {op: ref, ref: legal_element.commencement_of_execution}
          - {op: not, arg: {op: ref, ref: ground_fact.death_of_victim}}
          - {op: ref, ref: legal_element.voluntary_cessation_or_prevention}
      punishable: true
      blocked_when: {op: ref, ref: ground_fact.means_or_object_defect}
      suspends: [result, causation]
      requires:
        op: all
        args:
          - {op: ref, ref: legal_element.commencement_of_execution}
          - {op: ref, ref: legal_element.voluntary_cessation_or_prevention}
    impossible_attempt:
      when:
        op: all
        args:
          - {op: ref, ref: legal_element.commencement_of_execution}
          - {op: not, arg: {op: ref, ref: ground_fact.death_of_victim}}
          - {op: ref, ref: ground_fact.means_or_object_defect}
          - {op: ref, ref: legal_element.dangerousness}
      punishable: true
      suspends: [object, result, causation]
      requires:
        op: all
        args:
          - {op: ref, ref: legal_element.commencement_of_execution}
          - {op: ref, ref: ground_fact.means_or_object_defect}
          - {op: ref, ref: legal_element.dangerousness}
    preparation:
      when:
        op: all
        args:
          - op: any
            args:
              - {op: ref, ref: legal_element.preparatory_conduct}
              - {op: ref, ref: legal_element.conspiracy_agreement}
          - {op: not, arg: {op: ref, ref: legal_element.commencement_of_execution}}
      punishable: true
      defeated_by_state: [completed]
      suspends: [conduct, result, causation]
      requires: {op: ref, ref: legal_element.purpose_to_commit_target_offense}

