# Gate① first assembly slice: Criminal Act arts. 9, 11, 12, and 16.
# Canonical IDs/meanings are transcribed from predicate_dictionary_master_v3.md,
# except the Phase 1 canonical erratum recorded in ASSEMBLY_CROSSWALK.md (Article 10).

- id: ground_fact.actor_age_under_14_at_act_time
  arguments:
    - {name: actor, type: entity}
  canonical_meaning: "행위 당시 만 14세 미만"
  source_refs:
    - comment_id: "comm_001692_제9조_Ⅱ.1_2"
      section_path: "Ⅱ.1"
      quote: "범행 당시에 아직 형사책임연령인 14세가 되지 아니한 형사미성년자인 경우 처벌할 수 없다."

- id: ground_fact.coerced_act_performed
  arguments:
    - {name: actor, type: entity}
    - {name: act, type: entity}
  canonical_meaning: "강제상태 하 특정 행위(raw factual linkage)"
  source_refs:
    - comment_id: "comm_001692_제12조_Ⅱ.1_1"
      section_path: "Ⅱ.1"
      quote: "강요라 함은 피강요자가 자유스런 의사결정을 하지 못하게 하면서 특정한 행위를 하게 하는 것을 말한다."

- id: ground_fact.mental_disorder_at_act_time
  arguments:
    - {name: actor, type: entity}
  canonical_meaning: "행위 당시 정신적 장애 상태에 있었다"
  source_refs:
    - comment_id: "comm_001692_제10조_Ⅱ.2_3"
      section_path: "Ⅱ.2"
      quote: "책임능력 판단의 생물학적 요소인 정신장애의 판단은 의학적 기준에 의한다."

- id: ground_fact.perceived_fact
  arguments:
    - {name: actor, type: entity}
    - {name: fact, type: entity}
  canonical_meaning: "인식한 사실"
  source_refs:
    - comment_id: "comm_001692_제15조_1항_Ⅰ.1_0"
      section_path: "Ⅰ.1"
      quote: "착오란 행위의 주관적 측면과 객관적 측면의 불일치라고 할 수 있다."

- id: ground_fact.actual_fact
  arguments:
    - {name: fact, type: entity}
  canonical_meaning: "실제 발생 사실"
  source_refs:
    - comment_id: "comm_001692_제15조_1항_Ⅰ.1_0"
      section_path: "Ⅰ.1"
      quote: "행위자가 인식·의욕한 내용과 객관적으로 발생한 내용이 일치하지 않는 경우를 총칭한다."

- id: ground_fact.means_or_object_defect
  arguments:
    - {name: act, type: entity}
    - {name: object, type: entity}
  canonical_meaning: "수단·대상 착오로 결과발생 애초 불가능"
  source_refs:
    - comment_id: "comm_001692_제27조_Ⅲ.2_5"
      section_path: "Ⅲ.2"
      quote: "불능미수에 해당하기 위해서는 결과발생이 불가능한 것, 즉 범죄가 기수에 이를 수 없어야 한다."

- id: ground_fact.possibility_to_act
  arguments:
    - {name: actor, type: entity}
    - {name: act, type: entity}
  canonical_meaning: "행위가능성"
  source_refs:
    - comment_id: "comm_001692_제18조_Ⅰ.1_0"
      section_path: "Ⅰ.1"
      quote: "부작위범은 결과발생을 방지할 수 있는 행위의 가능성과 필요성에 관한 규범적 판단이 필연적으로 수반된다."

- id: ground_fact.failure_to_act
  arguments:
    - {name: actor, type: entity}
    - {name: act, type: entity}
  canonical_meaning: "부작위"
  source_refs:
    - comment_id: "comm_001692_제18조_Ⅰ.1_0"
      section_path: "Ⅰ.1"
      quote: "여기서의 부작위는 아무것도 하지 않는 단순한 무위가 아니라 법규범이 명령한 행위를 소극적으로 하지 않는 것을 말한다."

- id: ground_fact.prior_sentence_of_imprisonment_or_greater
  arguments:
    - {name: actor, type: entity}
  canonical_meaning: "전범 금고 이상 형 선고"
  source_refs:
    - comment_id: "comm_001692_제35조_Ⅰ.1_1"
      section_path: "Ⅰ.1"
      quote: "전범의 형은 금고 이상의 형일 것을 요한다."

- id: ground_fact.prior_sentence_execution_completed_or_exempted
