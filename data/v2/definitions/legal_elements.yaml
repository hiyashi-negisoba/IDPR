- id: legal_element.gross_negligence
  arguments: [{name: actor, type: entity}]
  canonical_meaning: "현저한 주의의무 위반 정도"
  legal_standard: "주의의무 위반이 현저하여 중대한 과실에 해당하는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제268조"}]

- id: legal_element.coercive_conduct
  arguments: [{name: actor, type: entity}, {name: victim, type: entity}]
  canonical_meaning: "폭행·협박"
  legal_standard: "피해자에 대하여 폭행 또는 협박을 가하였는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제297조; 제298조"}]

- id: legal_element.directness_of_coercion_by_offender
  arguments: [{name: actor, type: entity}]
  canonical_meaning: "행위자 본인 직접 가함"
  legal_standard: "폭행·협박을 행위자 본인이 직접 가하였는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제297조; 제298조"}]

- id: legal_element.coercion_induced_sexual_act_causation
  arguments: [{name: coercion, type: entity}, {name: sexual_act, type: entity}]
  canonical_meaning: "폭행·협박→성적행위 인과(death-agnostic 패턴)"
  legal_standard: "폭행·협박과 간음 또는 추행 사이에 인과관계가 있는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제297조; 제298조"}]

- id: legal_element.coercion_sufficiency_for_rape
  arguments: [{name: coercion, type: entity}]
  canonical_meaning: "항거불능/현저곤란 정도"
  legal_standard: "폭행·협박이 피해자의 항거를 불가능하게 하거나 현저히 곤란하게 할 정도인지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제297조"}]

- id: legal_element.coercion_sufficiency_for_forcible_indecency
  arguments: [{name: coercion, type: entity}]
  canonical_meaning: "낮은 기준(2018도13877 전합)"
  legal_standard: "폭행·협박이 추행의 수단으로서 피해자의 성적 자유를 침해할 정도인지 여부"
  authority_refs: [{authority_basis: commentary_reported_precedent, citation: "대법원 2018도13877 전원합의체"}]

- id: legal_element.indecent_act
  arguments: [{name: actor, type: entity}, {name: victim, type: entity}]
  canonical_meaning: "성적 자유 침해 추행"
  legal_standard: "객관적으로 일반인의 성적 수치심을 해하고 피해자의 성적 자유를 침해하는 추행인지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제298조; 제299조"}]

- id: legal_element.mental_incapacity_or_physical_helplessness_status
  arguments: [{name: victim, type: entity}]
  canonical_meaning: "심신상실·항거불능 상태"
  legal_standard: "피해자가 심신상실 또는 항거불능의 상태에 있었는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제299조"}]

- id: legal_element.exploitation_of_incapacity
  arguments: [{name: actor, type: entity}, {name: victim, type: entity}]
  canonical_meaning: "그 상태를 이용(객관적 이용관계만)"
  legal_standard: "행위가 피해자의 심신상실 또는 항거불능 상태를 이용한 것인지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제299조"}]

- id: legal_element.dwelling_or_managed_premises_object
  arguments: [{name: premises, type: entity}]
  canonical_meaning: "주거·관리 건조물 등"
  legal_standard: "사람의 주거·관리하는 건조물·선박 또는 점유하는 방실에 해당하는지 여부"
  evidence_scope: same_actor_episode
  authority_refs: [{authority_basis: statute_text, citation: "형법 제319조"}]

- id: legal_element.trespass_entry
  arguments: [{name: actor, type: entity}, {name: premises, type: entity}]
  canonical_meaning: "평온을 해하는 침입"
  legal_standard: "주거 등의 사실상 평온을 해치는 방법으로 침입하였는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제319조 제1항"}]

- id: legal_element.retreat_demand_by_authorized_person
  arguments: [{name: actor, type: entity}, {name: premises, type: entity}]
  canonical_meaning: "퇴거요구"
  legal_standard: "주거자·관리자 또는 점유자로부터 퇴거요구를 받았는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제319조 제2항"}]

- id: legal_element.justifiable_reason_for_refusal
  arguments: [{name: actor, type: entity}]
  canonical_meaning: "정당사유"
  legal_standard: "퇴거요구에 따르지 않을 정당한 사유가 있는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제319조 제2항"}]

- id: legal_element.ability_to_comply_with_retreat_demand
  arguments: [{name: actor, type: entity}]
  canonical_meaning: "이행가능성"
  legal_standard: "퇴거요구를 현실적으로 이행할 수 있었는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제319조 제2항"}]

- id: legal_element.failure_to_comply_without_delay
  arguments: [{name: actor, type: entity}]
  canonical_meaning: "지체 없는 불이행"
  legal_standard: "정당한 사유 없이 지체 없이 퇴거요구에 응하지 않았는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제319조 제2항"}]

- id: legal_element.own_property_object
  arguments: [{name: actor, type: entity}, {name: property, type: entity}]
  canonical_meaning: "자기소유물"
  legal_standard: "재물이 행위자 자신의 소유인지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제323조"}]

- id: legal_element.third_party_possession_or_right_object
  arguments: [{name: property, type: entity}]
  canonical_meaning: "타인점유·권리객체"
  legal_standard: "타인이 점유하거나 타인의 권리의 목적이 된 물건인지 여부"
  evidence_scope: same_actor_episode
  authority_refs: [{authority_basis: statute_text, citation: "형법 제323조"}]

- id: legal_element.taking_of_own_property_conduct
  arguments: [{name: actor, type: entity}, {name: property, type: entity}]
  canonical_meaning: "자기소유물 취거(불법영득의사 불요)"
  legal_standard: "자기 소유물을 취거하였는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제323조"}]

- id: legal_element.concealment_conduct
  arguments: [{name: actor, type: entity}, {name: property, type: entity}]
  canonical_meaning: "은닉"
  legal_standard: "물건을 은닉하였는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제323조"}]

- id: legal_element.damage_conduct
  arguments: [{name: actor, type: entity}, {name: property, type: entity}]
  canonical_meaning: "손괴"
  legal_standard: "물건을 손괴하였는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제323조"}]

- id: legal_element.obstruction_of_right_exercise
  arguments: [{name: property, type: entity}]
  canonical_meaning: "권리행사방해 우려"
  legal_standard: "타인의 점유 또는 권리행사를 방해할 우려가 발생하였는지 여부"
  authority_refs: [{authority_basis: statute_text, citation: "형법 제323조"}]

- id: legal_element.breach_of_trust_conduct
  arguments: [{name: actor, type: entity}, {name: principal, type: entity}]
  canonical_meaning: "임무위배로 재산상 이익을 취득하거나 제3자로 하여금 취득하게 한 행위"
  legal_standard: "타인의 사무처리자가 그 임무에 위배하여 자기 또는 제3자에게 재산상 이익을 취득하게 한 행위인지 여부"
  authority_refs:
    - authority_basis: statute_text
      citation: "형법 제355조 제2항"
    - authority_basis: commentary_synthesis
      citation: "케이스노트 형법각칙 제355조 제2항 Ⅰ.1; art355_sec3.breach_of_trust.objective_elements"

- id: legal_element.property_loss_or_concrete_risk
  arguments: [{name: principal, type: entity}]
  canonical_meaning: "본인에게 재산상 손해 또는 그에 준하는 구체적·현실적 손해 위험 발생"
  legal_standard: "본인에게 현실 재산상 손해 또는 경제적으로 손해 발생과 같은 정도의 구체적·현실적 위험이 발생하였는지 여부"
  authority_refs:
    - authority_basis: statute_text
      citation: "형법 제355조 제2항"
    - authority_basis: commentary_synthesis
      citation: "케이스노트 형법각칙 제355조 제2항 Ⅰ.1; art355_sec1_3.breach_of_trust_case_concrete_risk_of_loss"

- id: legal_element.object_misidentification
  arguments:
    - {name: actor, type: entity}
    - {name: object, type: entity}
  canonical_meaning: 행위자가 대상 자체를 다른 사람 또는 물건으로 잘못 알아본 경우(객체의 착오)
  legal_standard: 행위자가 목표로 삼은 대상 그 자체를 오인한 경우인지, 아니면 목표는 옳게 인식하였으나
    실행이 빗나가 다른 대상에 결과가 발생한 경우(방법의 착오)인지 여부
  authority_refs:
    - {authority_basis: statute_text, citation: 형법 제13조}
    - {authority_basis: commentary_reported_precedent, citation: 케이스노트 형법총칙 제13조 구체적 사실의 착오}

- id: legal_element.belief_in_justifying_circumstance
  arguments:
    - {name: actor, type: entity}
  canonical_meaning: 위법성조각사유의 사실적 전제가 존재한다고 믿은 사정
  legal_standard: 행위자가 정당방위 상황, 피해자의 승낙, 직무집행의 위법성 등 위법성조각사유의 전제가 되는
    사실이 존재한다고 인식하였는지 여부
  authority_refs:
    - {authority_basis: statute_text, citation: 형법 제16조}
    - {authority_basis: commentary_reported_precedent, citation: 케이스노트 형법총칙 위법성조각사유의 전제사실에 관한 착오}

- id: legal_element.foreseeability_of_aggravated_result_by_participant
  arguments:
    - {name: actor, type: entity}
    - {name: result, type: entity}
  canonical_meaning: 가담자 본인이 중한 결과의 발생을 예견할 수 있었던 사정
  legal_standard: 교사·방조·공모에 가담한 사람이 자신이 가담한 기본행위로부터 발생한 중한 결과를
    일반 경험칙상 예견할 수 있었는지 여부. 정범의 예견가능성과 구별한다.
  authority_refs:
    - {authority_basis: statute_text, citation: 형법 제15조 제2항}
    - {authority_basis: commentary_reported_precedent, citation: 케이스노트 형법총칙 결과적 가중범과 공범}
