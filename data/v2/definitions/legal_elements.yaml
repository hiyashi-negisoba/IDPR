  semantic_exclusions:
    - "결과가 실제 발생했다는 사후 사실만으로 예견가능성을 긍정하거나 부정하지 않고, 행위 당시 명시된 위험 사정을 평가한다."
    - "주의의무 위반, 결과회피가능성 및 실제 인과관계는 인접하지만 서로 다른 predicate다."
  evidence_scope: same_actor_episode
  authority_refs: [{authority_basis: statute_text, citation: "형법 제14조"}]

