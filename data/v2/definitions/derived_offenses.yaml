        - {op: ref, ref: legal_element.intent}
        - {op: ref, ref: legal_element.awareness_of_lineal_ascendant_status}

- id: derived_offense.fraud
  article151_penalty_threshold:
    class: fine_or_greater
    authority_refs: [{authority_basis: statute_text, citation: "형법 제347조 제1항"}]
  identity:
    name: 사기죄
    statutory_refs: ["형법 제347조 제1항", "형법 제347조 제2항"]
  indirect_principal_capability: {legally_possible: true}
  derivation:
    kind: compose
    components:
      - {kind: primitive, ref: primitive.deception, local_key: deception, slot: conduct}
      - {kind: primitive, ref: primitive.property_disposition, local_key: disposition, slot: circumstance}
      - {kind: primitive, ref: primitive.disposition_authority, local_key: authority, slot: circumstance}
      - {kind: primitive, ref: primitive.unlawful_appropriation_intent, local_key: appropriation_intent, slot: mental}
    relations:
      - {relation: relation.deception_error_disposition_causal_nexus, left: deception, right: disposition, left_view: event, right_view: event}
  flattened_elements:
    conduct: {op: ref, ref: legal_element.deception}
    circumstance:
      op: all
      args:
        - {op: ref, ref: legal_element.property_disposition}
        - {op: ref, ref: legal_element.disposition_authority}
    mental: {op: ref, ref: legal_element.unlawful_appropriation_intent}

- id: derived_offense.special_injury
  article151_penalty_threshold:
