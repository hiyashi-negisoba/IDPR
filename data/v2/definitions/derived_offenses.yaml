- id: derived_offense.special_aggravated_ancestral_injury
  # 제258조의2 제2항은 항을 따로 집지 않고 "제258조의 죄"라고 규정한다. 존속중상해가 제258조
  # 제3항이므로 위험한 물건 등을 이용한 존속중상해도 그 문언에 들어간다. (2026-08-15 검수)
  article151_penalty_threshold:
    class: fine_or_greater
    authority_refs: [{authority_basis: statute_text, citation: "형법 제258조의2 제2항"}]
  identity:
    name: 특수존속중상해죄
    statutory_refs: ["형법 제258조의2 제2항"]
  derivation:
    kind: qualify
    base: offense.ancestral_injury
    qualifier: qualifier.serious_special_injury_method
  flattened_elements:
    object:
      op: all
      args:
        - {op: ref, ref: legal_element.natural_person_victim_status}
        - {op: ref, ref: legal_element.lineal_ascendant_of_self_or_spouse_status}
    conduct: {op: ref, ref: ground_fact.injury_conduct}
    circumstance:
      op: any
      args:
        - {op: ref, ref: legal_element.group_or_multiple_force}
        - {op: ref, ref: legal_element.dangerous_object_carriage}
    result:
      op: all
      args:
        - {op: ref, ref: legal_element.injury_result}
        - {op: ref, ref: legal_element.serious_injury_result}
    mental:
      op: all
      args:
        - {op: ref, ref: legal_element.intent}
        - {op: ref, ref: legal_element.awareness_of_lineal_ascendant_status}

- id: derived_offense.robbery_rape
  article151_penalty_threshold:
    class: fine_or_greater
    authority_refs: [{authority_basis: statute_text, citation: "형법 제339조"}]
  identity:
    name: 강도강간죄
    statutory_refs: ["형법 제339조"]
  derivation:
    kind: compose
    components:
      - {kind: offense, ref: offense.robbery, local_key: robbery_part}
      - {kind: offense, ref: offense.rape, local_key: rape_part}
    relations:
      - {relation: relation.occasion_identity, left: robbery_part, right: rape_part, left_view: conduct, right_view: conduct}
  flattened_elements:
    object:
      op: all
      args:
        - {op: ref, ref: legal_element.possession}
        - {op: ref, ref: legal_element.natural_person_victim_status}
    conduct:
      op: all
      args:
        -
          op: all
          args:
            - {op: ref, ref: ground_fact.taking_conduct}
            - {op: ref, ref: legal_element.robbery_level_violence}
        -
          op: all
          args:
            - {op: ref, ref: legal_element.coercive_conduct}
            - {op: ref, ref: ground_fact.vaginal_intercourse_conduct}
    circumstance:
      op: all
      args:
        - {op: ref, ref: legal_element.directness_of_coercion_by_offender}
        - {op: ref, ref: legal_element.coercion_sufficiency_for_rape}
    causation: {op: ref, ref: legal_element.coercion_induced_sexual_act_causation}
    mental:
      op: all
      args:
        - {op: ref, ref: legal_element.unlawful_appropriation_intent}
        - {op: ref, ref: legal_element.intent}

- id: derived_offense.special_robbery_rape
  # 형법 제339조는 일반 강도강간의 근거조문이다. 특수강도(제334조)를 범한 사람이 강간 등을
  # 범한 경우는 성폭력처벌법 제3조 제2항이 직접 규정하므로 그쪽이 근거조문이다.
  # (2026-08-15 검수)
  article151_penalty_threshold:
    class: fine_or_greater
    authority_refs: [{authority_basis: statute_text, citation: "성폭력범죄의 처벌 등에 관한 특례법 제3조 제2항"}]
  identity:
    name: 특수강도강간죄
    statutory_refs: ["성폭력범죄의 처벌 등에 관한 특례법 제3조 제2항"]
  derivation:
    kind: compose
    components:
      - {kind: offense, ref: derived_offense.special_robbery, local_key: robbery_part}
      - {kind: offense, ref: offense.rape, local_key: rape_part}
    relations:
      - {relation: relation.occasion_identity, left: robbery_part, right: rape_part, left_view: conduct, right_view: conduct}
  flattened_elements:
    object:
      op: all
      args:
        - {op: ref, ref: legal_element.possession}
        - {op: ref, ref: legal_element.natural_person_victim_status}
    conduct:
      op: all
      args:
        -
          op: all
          args:
            - {op: ref, ref: ground_fact.taking_conduct}
            - {op: ref, ref: legal_element.robbery_level_violence}
        -
          op: all
          args:
            - {op: ref, ref: legal_element.coercive_conduct}
            - {op: ref, ref: ground_fact.vaginal_intercourse_conduct}
    circumstance:
      op: all
      args:
        -
          op: any
          args:
            - {op: ref, ref: legal_element.nighttime_entry}
            - {op: ref, ref: legal_element.dangerous_weapon_carriage}
            - {op: ref, ref: legal_element.joint_commission_by_two_or_more}
        - {op: ref, ref: legal_element.directness_of_coercion_by_offender}
        - {op: ref, ref: legal_element.coercion_sufficiency_for_rape}
    causation: {op: ref, ref: legal_element.coercion_induced_sexual_act_causation}
    mental:
      op: all
      args:
        - {op: ref, ref: legal_element.unlawful_appropriation_intent}
        - {op: ref, ref: legal_element.intent}

- id: derived_offense.quasi_robbery_rape
  # 준강도(제335조)도 제339조의 '강도'에 포함된다는 판례의 취지에 따른다.
  article151_penalty_threshold:
    class: fine_or_greater
    authority_refs: [{authority_basis: statute_text, citation: "형법 제339조"}]
  identity:
    name: 준강도강간죄
    statutory_refs: ["형법 제339조"]
  derivation:
    kind: compose
    components:
      - {kind: offense, ref: derived_offense.quasi_robbery, local_key: robbery_part}
      - {kind: offense, ref: offense.rape, local_key: rape_part}
    relations:
      - {relation: relation.occasion_identity, left: robbery_part, right: rape_part, left_view: conduct, right_view: conduct}
  flattened_elements:
    object:
      op: all
      args:
        - {op: ref, ref: legal_element.possession}
        - {op: ref, ref: legal_element.natural_person_victim_status}
    conduct:
      op: all
      args:
        -
          op: all
          args:
            - {op: ref, ref: ground_fact.taking_conduct}
            - {op: ref, ref: legal_element.robbery_level_violence}
        -
          op: all
          args:
            - {op: ref, ref: legal_element.coercive_conduct}
            - {op: ref, ref: ground_fact.vaginal_intercourse_conduct}
    circumstance:
      op: all
      args:
        - {op: ref, ref: legal_element.directness_of_coercion_by_offender}
        - {op: ref, ref: legal_element.coercion_sufficiency_for_rape}
    causation: {op: ref, ref: legal_element.coercion_induced_sexual_act_causation}
    mental:
      op: all
      args:
        - {op: ref, ref: legal_element.unlawful_appropriation_intent}
        -
          op: any
          args:
            - {op: ref, ref: legal_element.purpose_to_resist_recapture}
            - {op: ref, ref: legal_element.purpose_to_avoid_arrest}
            - {op: ref, ref: legal_element.purpose_to_conceal_evidence}
        - {op: ref, ref: legal_element.intent}

