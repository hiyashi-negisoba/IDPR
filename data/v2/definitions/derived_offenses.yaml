        - {op: ref, ref: ground_fact.injury_conduct}
    circumstance:
      op: all
      args:
        - {op: ref, ref: legal_element.directness_of_coercion_by_offender}
        - {op: ref, ref: legal_element.coercion_sufficiency_for_rape}
    causation: {op: ref, ref: legal_element.coercion_induced_sexual_act_causation}
    result: {op: ref, ref: legal_element.injury_result}
    mental:
      op: all
      args:
