- id: derived_offense.aggravated_injury
  article151_penalty_threshold:
    class: fine_or_greater
    authority_refs: [{authority_basis: statute_text, citation: "형법 제258조 제1항"}]
  identity:
    name: 중상해죄
    statutory_refs: ["형법 제258조 제1항", "형법 제258조 제2항"]
  derivation:
    kind: qualify
    base: offense.injury
    qualifier: qualifier.serious_injury_result
  flattened_elements:
    object: {op: ref, ref: legal_element.natural_person_victim_status}
    conduct: {op: ref, ref: ground_fact.injury_conduct}
    result:
      op: all
      args:
        - {op: ref, ref: legal_element.injury_result}
        - {op: ref, ref: legal_element.serious_injury_result}
    mental: {op: ref, ref: legal_element.intent}

