# 알려진 표현 공백. 각 항목은 "아직 표현할 수 없다"는 사실이지 법적 부정이 아니다.
#
# 이 파일이 존재하는 이유: 공백을 코드 주석이나 감사 문서에만 적어 두면 나중에 그 공백이
# 메워졌을 때 아무도 모른다. `tests/test_representation_gaps.py`가 각 항목이 여전히 공백인지
# 확인하므로, 누군가 폭행죄나 장물죄를 저작하면 테스트가 실패하면서 여기를 갱신하라고
# 알려 준다. 공백은 조용히 사라져서도 안 되고 조용히 남아서도 안 된다.

version: 1

gaps:
  # gap.intended_object_identity는 2026-08-15에 닫혔다. `factual_targets`를 재해석하지 않고
  # `directed_action_target` / `actual_result_bearer`를 Call 1.5 계약에 새로 넣었고, 둘이 모두
  # 결박된 경우에만 host가 `relation.intended_object_divergence`를 structural하게 계산한다.
  # `legal_element.object_misidentification`은 그 불일치가 TRUE인 instance에서만 열린다.
  # 원문이 지향 대상을 명시하지 않으면 여전히 UNRESOLVED_MISTAKE_BINDING으로 남는다 --
  # 그것은 공백이 아니라 3치 논리의 정상적인 미확정 상태다.

  - id: gap.assault_offense_family
    kind: unauthored_offense_family
    marker: UNRESOLVED_EXCESS_RELATION
    missing_articles: ["형법 제260조", "형법 제261조", "형법 제262조"]
    # 저작되면 테스트가 실패하도록 exact ref를 적어 둔다.
    absent_offense_refs:
      - offense.assault
      - offense.special_assault
      - derived_offense.assault_causing_injury_or_death
    summary: >-
      폭행죄·특수폭행죄·폭행치사상죄가 v2에 없다. 각칙 워크시트가 art259에서 art263으로
      건너뛰면서 세 조문이 통째로 빠졌다.
    consequence: >-
      `r11_p1_q1`의 질적 초과(교사한 절도를 넘어 폭행치상이 실현된 사안)를 판정할 수 없다.
      pair의 한 축이 없으므로 저작된 incompatible pair에 넣지 못하고, 검수 ③-a에 따라
      derivation 부재만으로 질적 초과라고 판정하지도 않는다. 따라서 미해결로 남는다.

  - id: gap.stolen_property_offense_family
    kind: unauthored_offense_family
    marker: UNRESOLVED_ABSORPTION_PAIR
    missing_articles: ["형법 제362조"]
    absent_offense_refs:
      - offense.stolen_property_acquisition
      - offense.stolen_property_custody
    summary: >-
      장물취득죄·장물보관죄가 v2에 없다. 2026-08-06에 장물죄 트랙이 보류된 이후 그대로다.
      카드는 이미 존재한다.
    consequence: >-
      `r10_p2_q1`의 불가벌적 사후행위(장물보관죄 성립 후 횡령)를 흡수 규칙으로 저작할 수
      없다. `r13_p2_q1`은 반대로 현재 상태가 정답이다 -- 본범의 장물취득죄 불성립은
      후보가 아예 생기지 않는 것으로 충족되고, 절취 카드 사용 사기죄가 불가벌적
      사후행위가 아니라는 결론도 흡수 규칙 부재가 그대로 정답이다.

  - id: gap.justifying_premise_vs_object_identity
    kind: factual_representation
    marker: NOT_RAISED_REPRESENTATION_GAP
    blocks:
      - doctrine.mistaken_justifying_circumstance
    withdrawn_cue: cue.justifying_premise_belief_mismatch_stated
    summary: >-
      위법성조각사유의 전제사실 착오를 사실 층에서 제기할 수 없다. 단서를 두 번 좁혔는데도
      사람·객체의 동일성 착오를 계속 잡았다.
    why_not_narrowed_further: >-
      문구의 정교함 문제가 아니다. episode_text 하나만 보고 "행위를 허용할 수 있는 외부 사정을
      잘못 믿은 것"과 "사람·객체를 잘못 안 것"을 안정적으로 분리할 수 없다.
      `gap.intended_object_identity`가 존재하는 이유와 같은 뿌리다. 2026-08-13 2차 실행에서
      `r12_p2_q1_ga`의 "침실에서 자고 있던 사람은 A의 운전기사 B였다"가 TRUE로 나와 Call 2
      target 8개를 열었다 -- harmless false raise가 아니다.
    consequence: >-
      `doctrine.mistaken_justifying_circumstance`는 저작되어 있고 런타임과 Scallop 경로도 있으나
      production에서 raised되지 않는다. cue는 `raising_status: representation_gap`으로 카탈로그에
      남아 있고, 테스트가 "제기 경로 또는 명시적 공백 둘 중 하나"를 요구한다.
    future_design: >-
      `directed_action_target`/`actual_result_bearer`는 2026-08-15에 사실로 결박되었으므로
      기술적 기반은 생겼다. 그러나 이 cue는 **의도적으로 닫아 둔다**(2026-08-15 검수 ②).
      다시 여는 것은 "두 대상이 같은데 외부 사정 인식만 어긋난 경우"로 cue를 좁히는 별도
      저작 작업이고, false raise 재발을 측정할 여유가 있을 때 한다.
