# v2 경합·흡수 규칙. legacy `data/rulebase/concurrence.yaml`을 조문 문자열이 아니라 exact
# DefinitionRef 쌍으로 다시 저작한 것이다.
#
# `status`가 이 파일의 유일한 게이트다. `approved`인 규칙만 런타임이 읽는다. 그 밖의 값은
# 저작은 되어 있으나 발화하지 않는다 -- 검수 전 규칙이 조용히 E2E에 섞이는 것을 막는다.
#
# 특별관계(specialty)는 여기에 없다. 그것은 사건 텍스트의 해석이 아니라 DSL 자신의
# `derivation.kind == "qualify"`를 읽는 것이므로 `runtime/concurrence.plan_specialty_candidates`가
# 저작 없이 만든다. 여기 있는 것은 조건 판단이 필요한 규칙뿐이다.

version: 1

rules:
  - rule_id: absorption.seal_forgery_by_private_document_forgery
    status: approved
    kind: absorption
    # ABSORPTION에서 first가 흡수되는 쪽(child)이다.
    first_offense_ref: offense.seal_forgery_or_misuse
    second_offense_ref: offense.private_document_forgery
    occurrence_constraint: same_episode
    # 2026-08-13 검수 확정. 흡수는 한 사람의 두 죄 사이의 관계를 표현한다. 같은 episode라는
    # 이유만으로 甲의 문서위조가 乙의 인장위조를 삼키면 identity defect다.
    actor_constraint: same
    # 2026-08-13 2차 검수로 조건을 재저작했다. 1차에서는 "위조된 인영"으로 좁혔으나 그것은
    # 제239조의 부정사용까지 잘라내는 과잉 축소였다. 인영의 현출 권한이 없으면 진정한 인장에서
    # 찍힌 인영이라도 사인위조가 성립할 수 있으므로 "물리적 도장이 진품인가"로 위조/부정사용을
    # 가를 수 없고, 부정사용죄가 사문서위조·행사죄에 흡수될 수 있음도 전제되어 있다.
    # `offense.seal_forgery_or_misuse`가 이미 두 형태를 한 정의에 담고 있으므로 조건도 그
    # authored offense 범위와 맞춘다. 조건이 가르는 것은 위조냐 부정사용이냐가 아니라
    # **그 인영이 바로 그 문서의 구성부분인가**다.
    #
    # 조건문은 **관계만** 진다. 권한 없는 위조·부정사용이었는지는 흡수되는 쪽 instance의
    # elements가 이미 판단했고, 해소 시점에는 그 instance가 established라는 것이 그것을
    # 보장한다. 조건이 권한 유무를 다시 물으면 하나의 neural target이 자기 몫의 atomic
    # proposition 하나만 판단한다는 v2 원칙이 깨지고, 같은 질문에 두 곳이 다르게 답할 수 있다.
    # ref 이름의 `unauthorized`는 내부 ID로 유지하되 조건문에는 싣지 않는다.
    condition_ref: condition.unauthorized_seal_impression_is_constituent_part_of_document
    condition_statement: >-
      첫 번째 행위와 관련하여 문제되는 인영이 두 번째 행위의 그 문서에 현출되어 그 문서의
      구성부분을 이루는가.
    legal_standard: >-
      그 인영이 바로 그 문서에 찍혀 그 문서의 기명·날인 부분을 이루었는지만 본다. 그 인영을
      얻거나 사용할 권한이 있었는지는 여기서 판단하지 않는다.
      인장 자체의 제작·보유와 해당 문서에 인영이 현출된 것은 구별한다. 원문이 인영의 현출
      여부를 밝히지 않으면 제작·보유 사실만으로 현출 또는 비현출을 추론하지 않는다.
    legacy_rule_id: art231_sec6.seal_forgery_absorbed
    source_card_ids: []
    basis: >-
      행사할 목적으로 타인의 인장을 위조하거나 권한 없이 사용하고 그 인영으로 타인의 사문서를
      위조한 경우 인장에 관한 죄는 사문서위조죄에 흡수되어 별도로 성립하지 않는다. 다만
      흡수되는 것은 그 문서의 구성부분이 된 인영에 관한 행위이고, 인과 자체를 별도로 제작한
      행위는 독립한 사인위조죄로 남는다.
    review_notes: >-
      KCL-26에서 유일하게 두 죄가 같은 factual episode에 함께 결박된 문항은
      `kcl_criminal_r12_p2_q1_da`이며 binding:002(사문서위조)와 binding:004(인장위조)가
      모두 factual_episode:001, 행위자도 모두 甲이다. 그 문항의 사실은 A의 진정한 인감도장을
      권한 없이 사용한 것이므로 1차 조건("위조된 인영") 아래에서는 문언상 FALSE였으나,
      재저작된 subtype-neutral 조건 아래에서는 모델이 판단할 대상이 된다. 다만 그 문항에서
      두 위조죄는 모두 elements에서 멈추므로 조건이 TRUE여도 해소 단계에서 흡수할 대상이
      성립하지 않는다.

  # 2026-08-15 저작. 결과적 가중범의 element에서 고의의 부존재를 요구하던 gate를 제거하면서,
  # 고의범이 실제로 성립했을 때의 배제를 이 층으로 옮긴 것이다. 구별 사실(상해·살인의 고의)은
  # 고의범 instance의 element가 이미 판단하므로 여기서 다시 묻지 않는다. 두 instance가 모두
  # established라는 사실이 유일한 근거이고, 그래서 assessable condition이 없다.
  - rule_id: definitional.robbery_intentional_injury_over_aggravated_result
    status: approved
    kind: definitional_resolution
    resolution_type: alternative_subtype
    # 밀려나는 쪽이 first다.
    first_offense_ref: derived_offense.robbery_causing_injury_by_aggravated_result
    second_offense_ref: derived_offense.robbery_causing_intentional_injury
    occurrence_constraint: same_realization
    actor_constraint: same
    condition_ref: definitional.same_article_alternative_subtype
    legal_standard: >-
      형법 제337조는 "상해하거나 상해에 이르게 한 때"를 하나의 조문에서 병렬로 규정한다. 강도상해와
      강도치상은 별개의 죄수관계가 아니라 같은 조문의 대안적 하위유형이므로, 상해의 고의가 인정되어
      강도상해가 성립하면 같은 실현행위를 강도치상으로 다시 분류하지 않는다. 반대로 상해 고의의
      부존재는 강도치상의 성립요건이 아니다.

  - rule_id: definitional.rape_intentional_injury_over_aggravated_result
    status: approved
    kind: definitional_resolution
    resolution_type: alternative_subtype
    first_offense_ref: derived_offense.rape_causing_injury_by_aggravated_result
    second_offense_ref: derived_offense.rape_causing_intentional_injury
    occurrence_constraint: same_realization
    actor_constraint: same
    condition_ref: definitional.same_article_alternative_subtype
    legal_standard: >-
      형법 제301조도 강간 등의 기회에 "상해하거나 상해에 이르게 한 때"를 함께 규정한다. 상해의 고의가
      인정되어 강간상해가 성립하면 같은 실현행위를 강간치상으로 다시 분류하지 않는다.

  - rule_id: definitional.homicide_over_injury_causing_death
    status: approved
    kind: definitional_resolution
    resolution_type: intent_displacement
    first_offense_ref: derived_offense.injury_causing_death
    second_offense_ref: offense.homicide
    occurrence_constraint: same_realization
    actor_constraint: same
    condition_ref: definitional.confirmed_intent_displaces_aggravated_result
    legal_standard: >-
      상해치사(제259조)와 살인(제250조)은 같은 조문의 하위유형이 아니라 별개 구성요건이다. 살인의
      고의가 인정되어 살인죄가 성립하면 같은 사망 결과를 상해치사로 중복 분류하지 않는다. 살인
      고의의 부존재를 상해치사의 성립요건으로 요구하지는 않는다.

  - rule_id: absorption.embezzlement_by_stolen_property_custody
    status: approved
    kind: absorption
    # ABSORPTION에서 first가 흡수되는 쪽(child)이다.
    first_offense_ref: offense.embezzlement
    second_offense_ref: offense.stolen_property_custody
    # `same_episode`가 아니다. 이 법리의 전형 자체가 "보관 성립 → 시간 경과 → 나중 영득"이라
    # episode 경계를 요건으로 쓰면 아는 false negative를 규칙에 저작하게 된다. 다만 순서는
    # 후보를 좁히는 결정론적 자료일 뿐이고, 보관상태의 계속성은 아래 condition이 따로 진다 --
    # 중간에 반환되어 보관이 끝났다가 다른 원인으로 다시 점유한 경우까지 순서만으로 통과하면
    # 안 되기 때문이다.
    occurrence_constraint: ordered_cross_episode
    actor_constraint: same
    condition_ref: condition.later_appropriation_of_property_still_held_under_the_earlier_custody
    condition_statement: >-
      후행 영득·처분의 대상이 선행 장물보관으로 계속 보관 중이던 바로 그 재물인가.
    legal_standard: >-
      선행 장물보관의 목적물이 후행 영득 시점까지 그 보관관계 아래 계속 있었고, 후행 영득의
      대상이 바로 그 재물인지만 본다. 보관이 적법하였는지, 영득의사가 언제 생겼는지는 여기서
      판단하지 않는다.
    source_card_ids: []
    basis: >-
      절도범으로부터 장물보관을 의뢰받아 장물임을 알면서 보관한 경우 장물보관죄가 성립하는
      때에 이미 소유자의 소유물추구권이 침해되었으므로, 그 후 보관 중인 장물을 임의로
      처분·영득하였더라도 이는 불가벌적 사후행위이고 별도의 횡령죄를 구성하지 않는다.
      (대법원 76도3067, 2004년 재확인)
    review_notes: >-
      `r10_p2_q1`이 이 규칙의 대상이다. 그 사안은 보관과 이후 영득이 시간적으로 떨어져 있어
      `same_episode`로는 후보조차 열리지 않는다.

