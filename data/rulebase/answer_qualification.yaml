version: "1.0.0"

# 결과적 가중범·결합범을 최종 답안의 독립 죄명으로 확정하려면 선행 기본범이 먼저
# 사실에 의해 지지되어야 한다. 해설 목차의 모든 절을 AND로 묶는 표가 아니라, 다른
# 범죄의 성립을 법정 선행조건으로 삼는 경우만 기록한다.
required_base_offenses:
  - offense: art259       # 상해치사
    any_of: [art257, art258, art2582_2]
    basis: "상해의 기본범이 성립한 뒤 사망 결과와 인과관계를 검토한다."

  - offense: art301       # 강간등 상해·치상
    any_of: [art297, art298, art299]
    basis: "강간·강제추행·준강간 등 기본범 또는 그 실행행위가 선행해야 한다."

  - offense: art337       # 강도상해·치상
    any_of: [art333, art334, art335]
    basis: "강도 또는 준강도의 기본범이 선행해야 한다."

  - offense: art338       # 강도살인·치사
    any_of: [art333, art334, art335]
    basis: "강도 또는 준강도의 기본범이 선행해야 한다."
