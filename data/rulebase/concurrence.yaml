# 죄수론 (罪數論) — 조건부 관계표
#
# 죄수 관계는 거의 언제나 조건부다. "위법사실을 적극 **은폐할 목적으로** 허위공문서를
# 작성·행사한 경우에는 … 직무유기죄는 별도로 성립하지 않는다" — 은폐 목적이 없으면
# 실체적 경합이라고 같은 조문의 다른 카드가 말한다.
#
# 그래서 이 표는 카드를 관계로 **번역하지 않는다**. 카드를 조건으로 그대로 두고, 표에는
# "이 카드가 어느 조문 쌍에 관한 것인가"만 적는다. `condition`은 그 카드의 id이고, 콜 2가
# 그 명제를 사안에 대해 `satisfied`로 판정할 때만 관계가 발화한다. 카드가 담고 있던 조건이
# 그대로 살아 있으므로, 조건을 버리고 무조건 규칙으로 굳히는 일이 없다.
#
#   rel is_absorbed(c, child) = offense_established(c, child), offense_established(c, parent),
#                               absorbed_by(child, parent, cond), card_status(c, cond, "satisfied")
#
# `condition: unconditional`은 조건 없이 항상 발화한다. 근거 카드가 조건절 없이 서술된
# 경우에만 쓴다.
#
# 남은 구조적 제약은 둘이다(조건 문제는 위에서 해결됐다).
#
#   1. 죄명 = 조문. 같은 조문 안의 죄 사이 관계(존속살해 ↔ 보통살인, 뇌물수수 ↔ 뇌물요구,
#      주거침입 ↔ 퇴거불응)는 표현할 수 없다.
#   2. 코퓨스는 형법각칙 51개 조문뿐이다. 특별법(성폭법·특가법)이나 코퓨스 밖 각칙
#      조문(폭행 제260조, 협박 제283조, 수뢰후부정처사 제131조)이 한쪽에 있으면 발화할
#      상대가 없다. rubric의 죄수 항목 다수가 성폭법 결합범이라 이 제약이 실효 커버리지를
#      크게 깎는다.
#
# 실체적 경합은 항목이 필요 없다. 두 죄가 각각 성립하고 둘 다 최종 죄명이 되는 것이
# 룰베이스의 기본 동작이다.

version: "2.0.0-conditional"
status: awaiting_legal_review

# ── 흡수·법조경합 ───────────────────────────────────────────────────────────
# child가 성립하되 최종 죄명에서 빠진다. 다만 `is_absorbed`는 질의 대상이므로 콜 3이
# "X죄는 Y죄에 흡수되어 별도로 성립하지 않는다"를 서술할 수 있다 — rubric이 점수를 주는
# 것은 죄명을 지우는 것이 아니라 그 서술이다.
absorbed_by:
  - child: art122          # 직무유기
    parent: art227         # 허위공문서작성
    condition: art122_sec3_2.false_document_concealment_absorption
    basis: "위법사실을 적극 은폐할 목적으로 허위공문서를 작성·행사한 경우에는 직무위배의 위법상태가 허위공문서작성 행위에 포함되어 허위공문서작성죄만 성립하고 직무유기죄는 별도로 성립하지 않는다."
    note: "은폐 목적이 없으면 실체적 경합이라는 반대 카드가 같은 조문에 있다. 조건 카드가 그 구분을 담는다."

  - child: art122          # 직무유기
    parent: art137         # 위계에 의한 공무집행방해
    condition: art122_sec3_4.deceptive_obstruction_excludes_dereliction
    basis: "직무위배의 위법 상태가 위계에 의한 공무집행방해에 포함되는 경우, 작위범인 위계에 의한 공무집행방해죄만 성립하고 부작위범인 직무유기죄는 별도로 성립하지 않는다."

  - child: art366          # 손괴
    parent: art164         # 현주건조물방화
    condition: art164.arson_property_damage_absorption
    basis: "방화행위로 건조물 등을 손괴한 경우, 그 손괴는 방화의 불가벌적 수반행위로서 법조경합 관계에 따라 방화죄에 흡수된다."

  - child: art366          # 재물손괴
    parent: art250         # 살인
    condition: art250_sec1_20.clothing_damage_absorbed
    basis: "살인행위에 따른 의복 손괴는 불가벌적 수반행위로서 재물손괴죄가 살인죄에 흡수된다."

  - child: art239          # 사인등의 위조
    parent: art231         # 사문서위조
    condition: art231_sec6.seal_forgery_absorbed
    basis: "행사할 목적으로 타인의 인장을 위조하고 그 인장으로 타인의 사문서를 위조한 경우 인장위조죄는 사문서위조죄에 흡수되어 별도로 성립하지 않는다."

  - child: art255          # 살인예비·음모
    parent: art250         # 살인
    condition: art255_sec6.attempt_or_completion_absorption
    basis: "살인예비·음모가 살인미수 또는 살인기수 단계에 이르면 예비·음모죄는 미수 또는 기수죄에 흡수되어 별도로 성립하지 않는다."
    note: "art250이 성립해야 발화하므로 규칙 본문이 이미 '기수 단계에 이름'을 담는다. 조건 카드는 미수 단계까지 포함하는지를 담는다."

  - child: art257          # 상해
    parent: art250         # 살인
    condition: art257_sec1_7.injury_absorbed_by_murder
    basis: "상해 후 살인한 경우 상해는 살인의 수반행위로서 살인죄와 법조경합 관계에 있다."

  - child: art347          # 사기
    parent: art355         # 횡령
    condition: art355_sec3_3.deceptive_means_no_fraud
    basis: "횡령을 실현하기 위해 기망수단을 사용하더라도 재물 이전과 피해자의 재산적 처분행위가 없으므로 횡령죄만 성립하고 사기죄는 별도로 성립하지 않는다."
    note: "조건이 '재물 이전과 처분행위가 없을 것'이라 무조건 흡수가 아니다. 조건 카드가 그것을 담는다."

# ── 상상적 경합 ─────────────────────────────────────────────────────────────
imaginative_concurrence:
  - offenses: [art164, art250]   # 현주건조물방화 ↔ 살인(미수)
    condition: art164_sec3_4.intentional_killing_no_death
    basis: "사람을 살해할 생각으로 현주건조물에 방화하였으나 사망하지 않은 경우 현주건조물방화죄와 살인미수죄의 상상적 경합범이 된다."
    note: "조건이 '사망하지 않았을 것'이다. 사망한 사안에서는 조건 카드가 not_satisfied가 되어 발화하지 않으므로, 같은 조문의 반대 카드(사망 시 방화치사로 의율)와 충돌하지 않는다."

  - offenses: [art164, art338]   # 현주건조물방화치사 ↔ 강도살인
    condition: art164_sec3_6.robbery_murder_fire_death_concurrence
    basis: "재물을 강취한 뒤 피해자를 살해할 목적으로 현주건조물에 방화하여 사망하게 한 경우, 강도살인죄와 현주건조물방화치사죄는 상상적 경합 관계."

  - offenses: [art234, art356]   # 위조사문서행사 ↔ 업무상배임
    condition: art234_sec4.company_agreement_breach_ideal_concurrence
    basis: "회사 명의 합의서를 임의로 작성·교부한 행위로 인한 사문서위조 및 위조사문서행사죄와, 그로 인한 회사 재산상 손해의 업무상배임죄는 하나의 행위로서 상상적 경합관계에 있다."

  - offenses: [art250, art255]   # 살인교사 ↔ 살인예비·음모
    condition: art250_sec1_19.instigated_injury_instead_of_murder
    basis: "살인을 교사하였으나 피교사자가 상해행위만 한 경우 교사자는 상해죄의 교사범이 되는 동시에 교사의 미수에 해당하며, 상상적 경합으로 더 무거운 살인예비·음모죄로 처벌한다."
    note: "위 absorbed_by(art255 → art250)와 조건이 다르다. 이쪽은 피교사자가 실행에 착수하지 않은 사안이고, 그 경우 art250이 성립하지 않아 흡수 규칙은 애초에 발화하지 않는다."

# ── 표현할 수 없는 것 (기록 목적) ────────────────────────────────────────────
not_expressible:
  same_article:
    reason: 죄명 키가 조문이라 조문 하위 죄명 사이의 관계를 쓸 수 없다
    examples:
      - "존속살해죄가 성립하면 특별관계에 있는 보통살인죄는 별도로 성립하지 않는다 (art250 내부)"
      - "뇌물요구죄와 뇌물약속죄는 뇌물수수죄에 흡수된다 (art129 내부)"
      - "주거침입죄 기수 후 퇴거요구에 불응하더라도 별도로 퇴거불응죄는 성립하지 않는다 (art319 내부)"
      - "증뢰물전달죄는 증뢰죄에 흡수된다 (art133 내부)"
  multiplicity:
    reason: 사건당 죄명 성립은 사실 하나이고 개수가 아니어서 포괄일죄·동종 다중 성립을 쓸 수 없다
    examples:
      - "1개의 행위로 여러 사람을 살해한 경우 여러 개의 살인죄가 상상적 경합"
      - "한 기일에 여러 사실에 관하여 계속 허위진술하면 포괄하여 1개의 위증죄"
      - "각 추행행위마다 하나의 범죄이나 범의의 단일성이 인정되면 포괄일죄"
  outside_corpus:
    reason: |
      상대 조문이 형법각칙 51개 코퓨스 밖이어서 발화할 상대가 없다. rubric의 죄수 항목
      다수가 성폭법 결합범이라 이 제약이 실효 커버리지를 크게 깎는다.
    examples:
      - "공무집행방해죄가 성립하면 폭행죄(제260조)·협박죄(제283조)는 흡수된다"
      - "주거침입강간죄(성폭법) 논의 시 주거침입죄는 특별관계로 불성립"
      - "허위공문서작성죄와 수뢰후부정처사죄(제131조)는 상상적 경합"
      - "제3자뇌물수수죄와 직권남용권리행사방해죄(제123조)는 상상적 경합"
      - "업무상과실치사상죄와 도로교통법·산업안전보건법·중대재해처벌법 위반의 관계"
