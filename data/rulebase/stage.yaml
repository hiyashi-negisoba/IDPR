# 미수·예비 처벌 규정 — 검수 대상 초안
#
# `stage_seed`로 라우팅된 59장 중 표로 옮길 수 있는 것은 **미수·예비 처벌 규정의 존재**
# 하나뿐이다. 나머지 대부분은 기수시기 판단이고("불법영득의사가 객관적으로 외부에 표현된
# 때 기수에 이른다"), 그 판단은 사안마다 달라 콜 2가 평가해야 한다. 표로 옮기면 판단을
# 상수로 굳히는 셈이 된다.
#
# 미수 처벌 규정의 존재는 그와 달리 조문에 적혀 있는 사실이고, 심볼릭 레이어에 값이 있다.
# 기수가 막힌 죄명에 대해 "이 죄는 미수 처벌 규정이 있으므로 미수를 검토해야 한다"를
# 결정론적으로 띄울 수 있다. 스모크 케이스의 중지미수 논점이 정확히 이 경로다.

version: "1.0.0-draft"
status: awaiting_legal_review

# ── 미수범 처벌 규정이 있는 조문 ────────────────────────────────────────────
# 코퓨스(형법각칙 51조문) 안에 있는 조문만 적었다. 조문 하나가 여러 조문의 미수를
# 처벌하는 경우(제254·300·342조)는 그 열거를 펼쳐 적고 근거에 원문을 남겼다.
#
# `attempt_article`은 그 미수를 처벌하는 조문 자신이며, 코퓨스가 그 조문을 카드로
# 들고 있을 때만 적는다(제254·300·342조 셋뿐). 조문 선정 단계가 이것을 읽어
# 기본 조문이 뽑히면 미수 조문을 결정론적으로 딸려 붙인다 -- 미수 조문의 텍스트는
# "제329조 내지 제341조의 미수범은 처벌한다"뿐이라 어떤 사실관계와도 어휘가 겹치지
# 않고, 어떤 검색으로도 어떤 모델로도 도달할 수 없기 때문이다. 조문에 적힌 준용
# 관계를 그대로 펼치는 것이므로 정답을 역산하는 것이 아니다.
# 문서죄(제235조)·특수상해(제258조의2 제4항)의 미수 조문은 코퓨스 밖이라 비워 둔다.
attempt_punishable:
  # 제254조 — 제250조·제252조·제253조의 미수범
  - offense: art250        # 살인
    attempt_article: art254
    basis: "제250조, 제252조 및 제253조의 미수범은 처벌된다. / 살인미수범은 처벌한다."

  # 제300조 — 강간·유사강간·강제추행·준강간 등의 미수범
  - offense: art297        # 강간
    attempt_article: art300
    basis: "강간죄, 유사강간죄, 강제추행죄 및 준강간·준유사강간·준강제추행죄의 미수범은 처벌된다."
  - offense: art298        # 강제추행
    attempt_article: art300
    basis: "(제300조) 강제추행죄의 미수범은 처벌된다."
  - offense: art299        # 준강간·준강제추행
    attempt_article: art300
    basis: "준강간죄의 미수범과 예비·음모범 및 준유사강간·준강제추행죄의 미수범은 처벌한다."

  # 제342조 — 제329조 내지 제341조의 미수범
  - offense: art329        # 절도
    attempt_article: art342
    basis: "형법 제329조 내지 제341조의 미수범은 처벌된다."
  - offense: art330        # 야간주거침입절도
    attempt_article: art342
    basis: "(제342조)"
  - offense: art331        # 특수절도
    attempt_article: art342
    basis: "(제342조)"
  - offense: art332        # 상습절도
    attempt_article: art342
    basis: "(제342조)"
  - offense: art333        # 강도
    attempt_article: art342
    basis: "(제342조)"
  - offense: art334        # 특수강도
    attempt_article: art342
    basis: "(제342조)"
  - offense: art335        # 준강도
    attempt_article: art342
    basis: "준강도죄의 미수범은 처벌된다. / (제342조)"
  - offense: art337        # 강도상해·치상
    attempt_article: art342
    basis: "(제342조)"
  - offense: art338        # 강도살인·치사
    attempt_article: art342
    basis: "(제342조) 강도가 살의로 가해행위를 하였으나 살해 목적을 이루지 못한 살인미수의 경우 강도살인죄의 미수가 된다."

  # 문서죄
  - offense: art225        # 공문서위조·변조
    basis: "본죄의 미수범은 처벌된다."
  - offense: art231        # 사문서위조·변조
    basis: "사문서위조·변조죄의 미수범은 처벌된다."
  - offense: art234        # 위조사문서행사
    basis: "위조사문서등의 행사죄의 미수범은 처벌된다."

  # 상해
  - offense: art2582_2     # 특수상해
    basis: "특수상해죄와 특수존속상해죄의 미수범은 처벌된다."

# ── 예비·음모 처벌 규정이 있는 조문 ─────────────────────────────────────────
preparation_punishable:
  - offense: art250        # 살인 (제255조)
    basis: "살인예비·음모죄에는 살인죄, 존속살해죄 또는 위계·위력에 의한 살인죄를 범할 목적이 필요하다."
  - offense: art333        # 강도 (제343조)
    basis: "주거침입강도 목적으로 흉기를 휴대하고 목적지를 향하여 출발하면 강도예비죄가 성립한다."
  - offense: art299        # 준강간
    basis: "준강간죄의 미수범과 예비·음모범 … 은 처벌한다."

# ── 명시적으로 없는 것 ──────────────────────────────────────────────────────
# 카드가 부재를 적극적으로 진술한 경우. 부재를 사실로 적어두면 "표에 없음"과
# "규정이 없음"이 구별된다.
not_punishable:
  - offense: art152
    stage: preparation
    basis: "위증 예비·음모 처벌규정이 없으므로 처벌할 수 없다."

# ── 검수 요청 사항 ──────────────────────────────────────────────────────────
review_notes:
  - |
    제342조가 제329~341조의 미수를 처벌하는데, 코퓨스에 없는 제336조(인질강도)·
    제340조(해상강도)·제341조(상습강도)는 적지 않았다. 코퓨스 밖 조문은 죄명 자체가
    없어 발화할 상대가 없다.
  - |
    제301조(강간등상해·치상)·제301조의2(강간등살인·치사)의 미수 처벌 여부를 명시한
    카드가 없다. 결과적 가중범이라 미수 개념이 문제되는데, 표에 넣지 않았다.
  - |
    제300조 열거에 "유사강간죄"(제297조의2)가 있으나 코퓨스에 그 조문 키가 없어
    제외했다.
  - |
    art332(상습절도)·art334(특수강도) 등 제342조의 열거를 제가 펼쳐 적은 것이라
    조문별 확인이 필요하다. 근거 카드는 열거를 통째로 진술할 뿐 조문별로 말하지 않는다.
