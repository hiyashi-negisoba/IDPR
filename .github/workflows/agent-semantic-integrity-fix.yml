name: Completion semantic integrity fix

on:
  push:
    branches:
      - agent/v2-semantic-integrity-fix
    paths:
      - .github/workflows/agent-semantic-integrity-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-semantic-integrity-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install pytest pydantic pyyaml jsonschema
      - name: Patch completion compiler and validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/idpr/v2/runtime/scallop_backend.py')
          text = path.read_text()

          old = '            state = completion_mod._derive_state(outcomes)\n'
          new = '            state = completion_mod._derive_state(outcomes, policy.payload["states"])\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '''        expression_helper = _emit_expression(expression, lines, emitted)\n        helper = _completion_helper_name("candidate", compiled.id, name)\n        _emit_completion_candidate(helper, compiled.id, _state_scope_ref(compiled, state), expression_helper, lines)\n'''
          new = '''        expression_helper = _emit_expression(expression, lines, emitted)\n        blocker = expressions.canonicalize(state.get("blocked_when"))\n        blocker_helper = _emit_expression(blocker, lines, emitted) if blocker is not None else None\n        helper = _completion_helper_name("candidate", compiled.id, name)\n        _emit_completion_candidate(\n            helper,\n            compiled.id,\n            _state_scope_ref(compiled, state),\n            expression_helper,\n            blocker_helper,\n            lines,\n        )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '    selected = _emit_completion_selection(compiled.id, names, candidates, lines)\n'
          new = '    selected = _emit_completion_selection(compiled.id, names, candidates, states, lines)\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          start = text.index('def _emit_completion_candidate(')
          end = text.index('\ndef _emit_completion_all(', start)
          replacement = '''def _emit_completion_candidate(\n    helper: str,\n    target_ref: str,\n    scope_ref: str,\n    expression_helper: str,\n    blocker_helper: str | None,\n    lines: list[str],\n) -> None:\n    target = f"v2_completion_target_instance(c, a, {_scl_string(target_ref)}, i)"\n    expression = lambda suffix: f"{expression_helper}_{suffix}(c, a, {_scl_string(scope_ref)}, i)"\n    for suffix in ("true", "false", "unknown"):\n        lines.append(f"type {helper}_{suffix}(String, String, String)")\n    if blocker_helper is None:\n        for suffix in ("true", "false", "unknown"):\n            lines.append(\n                f"rel {helper}_{suffix}(c, a, i) = {target} and {expression(suffix)}"\n            )\n    else:\n        blocker_true = f"{blocker_helper}_true(c, a, {_scl_string(scope_ref)}, i)"\n        lines.append(\n            f"rel {helper}_true(c, a, i) = {target} and {expression('true')} and not {blocker_true}"\n        )\n        lines.append(f"rel {helper}_false(c, a, i) = {target} and {expression('false')}")\n        lines.append(f"rel {helper}_false(c, a, i) = {target} and {blocker_true}")\n        lines.append(\n            f"rel {helper}_unknown(c, a, i) = {target} and {expression('unknown')} and not {blocker_true}"\n        )\n    lines.append("")\n\n\ndef _emit_completion_selection(\n    offense_id: str,\n    names: Sequence[str],\n    candidates: Mapping[str, str],\n    states: Mapping[str, Mapping[str, object]],\n    lines: list[str],\n) -> Mapping[str, str]:\n    target = f"v2_completion_target_instance(c, a, {_scl_string(offense_id)}, i)"\n    surviving: dict[str, str] = {}\n    for name in names:\n        helper = _completion_helper_name("surviving", offense_id, name)\n        surviving[name] = helper\n        defeaters = tuple(states[name].get("defeated_by_state") or ())\n        unknown = [defeater for defeater in defeaters if defeater not in candidates]\n        if unknown:\n            raise ScallopBackendContractError(\n                f"completion state {name!r} has unknown defeated_by_state targets: {unknown!r}"\n            )\n        guards = [f"not {candidates[defeater]}_true(c, a, i)" for defeater in defeaters]\n        lines.append(f"type {helper}(String, String, String)")\n        lines.append(\n            f"rel {helper}(c, a, i) = {' and '.join([target, f'{candidates[name]}_true(c, a, i)', *guards])}"\n        )\n\n    selected: dict[str, str] = {}\n    for name in names:\n        helper = _completion_helper_name("selected", offense_id, name)\n        selected[name] = helper\n        negative = [f"not {surviving[other]}(c, a, i)" for other in names if other != name]\n        lines.append(f"type {helper}(String, String, String)")\n        lines.append(\n            f"rel {helper}(c, a, i) = {' and '.join([target, f'{surviving[name]}(c, a, i)', *negative])}"\n        )\n\n    no_surviving = [f"not {surviving[name]}(c, a, i)" for name in names]\n    unresolved = _completion_helper_name("selected", offense_id, "unresolved")\n    lines.append(f"type {unresolved}(String, String, String)")\n    for left, right in combinations(names, 2):\n        lines.append(\n            f"rel {unresolved}(c, a, i) = {target} and {surviving[left]}(c, a, i) and {surviving[right]}(c, a, i)"\n        )\n    for name in names:\n        lines.append(\n            f"rel {unresolved}(c, a, i) = {' and '.join([target, *no_surviving, f'{candidates[name]}_unknown(c, a, i)'])}"\n        )\n\n    not_applicable = _completion_helper_name("selected", offense_id, "not_applicable")\n    lines.append(f"type {not_applicable}(String, String, String)")\n    no_unknown = [f"not {candidates[name]}_unknown(c, a, i)" for name in names]\n    lines.append(\n        f"rel {not_applicable}(c, a, i) = {' and '.join([target, *no_surviving, *no_unknown])}"\n    )\n    return selected\n\n'''
          text = text[:start] + replacement + text[end + 1:]
          path.write_text(text)
          PY
      - name: Add semantic parity regression tests
        shell: bash
        run: |
          cat > tests/test_completion_scallop_semantic_parity.py <<'PY'
          from __future__ import annotations

          from pathlib import Path

          from idpr.v2.compile import CompiledOffense, compile_offense
          from idpr.v2.registry import load_definitions
          from idpr.v2.runtime.completion import completion_policy_for
          from idpr.v2.runtime.identity import OffenseInstanceKey
          from idpr.v2.runtime.scallop_backend import (
              _completion_helper_name,
              compile_completion_program,
              validate_completion_query_rows,
          )

          ROOT = Path(__file__).resolve().parents[1]
          REGISTRY = load_definitions(ROOT / 'data/v2/definitions')


          def _compiled(offense_ref: str) -> CompiledOffense:
              compiled = compile_offense(REGISTRY, offense_ref)
              assert isinstance(compiled, CompiledOffense)
              return compiled


          def test_compiler_emits_confirmed_blocker_semantics() -> None:
              offense_ref = 'offense.theft'
              compiled = _compiled(offense_ref)
              policy = completion_policy_for(REGISTRY, offense_ref)
              assert policy is not None
              assert policy.payload['states']['attempted'].get('blocked_when') is not None

              lines = compile_completion_program(REGISTRY, [compiled]).program.splitlines()
              candidate = _completion_helper_name('candidate', offense_ref, 'attempted')
              true_lines = [line for line in lines if line.startswith(f'rel {candidate}_true(')]
              false_lines = [line for line in lines if line.startswith(f'rel {candidate}_false(')]
              unknown_lines = [line for line in lines if line.startswith(f'rel {candidate}_unknown(')]

              assert len(true_lines) == 1 and ' and not ' in true_lines[0]
              assert len(false_lines) == 2
              assert len(unknown_lines) == 1 and ' and not ' in unknown_lines[0]


          def test_compiler_emits_authored_defeated_by_state_yield() -> None:
              offense_ref = 'offense.homicide'
              compiled = _compiled(offense_ref)
              policy = completion_policy_for(REGISTRY, offense_ref)
              assert policy is not None
              states = policy.payload['states']
              assert 'abandoned_attempt' in (states['attempted'].get('defeated_by_state') or ())

              lines = compile_completion_program(REGISTRY, [compiled]).program.splitlines()
              attempted = _completion_helper_name('candidate', offense_ref, 'attempted')
              abandoned = _completion_helper_name('candidate', offense_ref, 'abandoned_attempt')
              surviving = _completion_helper_name('surviving', offense_ref, 'attempted')
              rule = next(line for line in lines if line.startswith(f'rel {surviving}('))

              assert f'{attempted}_true(c, a, i)' in rule
              assert f'not {abandoned}_true(c, a, i)' in rule


          def test_validator_uses_authored_yield_semantics() -> None:
              offense_ref = 'offense.homicide'
              compiled = _compiled(offense_ref)
              policy = completion_policy_for(REGISTRY, offense_ref)
              assert policy is not None
              states = policy.payload['states']
              target = OffenseInstanceKey('case', 'actor', offense_ref, 'occurrence')
              fields = ('case', 'actor', offense_ref, 'occurrence')

              truth_by_state = {name: 'FALSE' for name in states}
              truth_by_state['attempted'] = 'TRUE'
              truth_by_state['abandoned_attempt'] = 'TRUE'
              candidate_rows = [(*fields, name, truth_by_state[name]) for name in states]

              selected = 'abandoned_attempt'
              label = 'TRUE' if states[selected]['punishable'] else 'FALSE'
              result_rows = [(*fields, selected, label)]
              element_rows = [(*fields, 'TRUE')] if label == 'TRUE' else []

              _, results, _ = validate_completion_query_rows(
                  candidate_rows,
                  result_rows,
                  element_rows,
                  registry=REGISTRY,
                  compiled_offenses=[compiled],
                  targets=[target],
              )
              assert results[target] == (selected, label)
          PY
      - name: Run focused completion tests
        run: >-
          pytest -q
          tests/test_completion_scallop_semantic_parity.py
          tests/test_completion_authored_coverage.py
          tests/test_completion_state_coverage.py
      - name: Amend staging commit with tested fix
        shell: bash
        run: |
          git config user.name 'chatgpt-agent'
          git config user.email 'chatgpt-agent@users.noreply.github.com'
          git rm .github/workflows/agent-semantic-integrity-fix.yml
          git add src/idpr/v2/runtime/scallop_backend.py tests/test_completion_scallop_semantic_parity.py
          git commit --amend -m 'fix(v2): preserve completion policy semantics in Scallop'
          git push --force-with-lease origin HEAD:agent/v2-semantic-integrity-fix
